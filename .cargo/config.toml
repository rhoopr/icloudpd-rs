# Increase stack reservation AND commit on Windows to prevent overflow
# during debug builds. Config::build_inner and related async machinery
# create stack frames that fit within Linux's 8 MiB default but exceed
# Windows' 1 MiB default in unoptimized builds.
#
# Setting both reserve and commit to 4 MiB ensures all pages are
# immediately committed, avoiding __chkstk probe failures during
# function prologues on Windows.
[target.'cfg(windows)']
rustflags = ["-C", "link-args=/STACK:4194304,4194304"]
